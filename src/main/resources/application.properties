# =================================================================
# CẤU HÌNH ỨNG DỤNG PANACEA HOTEL BOOKING SYSTEM
# =================================================================
# Hệ thống đặt phòng khách sạn với các chức năng:
# - Quản lý booking, phòng, khách hàng
# - Thanh toán và khuyến mãi
# - Quản lý dịch vụ và inventory
# - Đăng nhập OAuth2 (Google, Facebook)
# - Gửi email thông báo
# =================================================================

# Tên ứng dụng và cổng server
spring.application.name=Website_Dat_Lich_Khach_San
server.port=8080

# =================================================================
# CẤU HÌNH DATABASE - SQL SERVER
# =================================================================
# Kết nối đến SQL Server database HotelBookingDB_LastStand_11
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HotelBookingDB_LastStand_11;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driverClassName=com.microsoft.sqlserver.jdbc.SQLServerDriver

# =================================================================
# CẤU HÌNH HIKARICP CONNECTION POOL
# =================================================================
# Tối ưu hóa kết nối database với connection pooling
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.pool-name=HikariPool-1

# =================================================================
# CẤU HÌNH JPA/HIBERNATE
# =================================================================
# Cấu hình để debug SQL và không tự động tạo/cập nhật schema
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

