<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý Thanh toán - Panacea</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
    <link rel="stylesheet" th:href="@{/css/NhanVien/style.css}">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background: #f9fafb;
            color: #1f2937;
        }

        header {
            background: linear-gradient(90deg, #10b981, #059669);
            color: white;
            padding: 1rem 2rem;
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        main {
            max-width: 1200px;
            margin: auto;
            padding: 2rem;
        }

        .section {
            background: white;
            padding: 2.5rem 2rem;
            border-radius: 16px;
            margin-bottom: 2.5rem;
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
        }

        h2 {
            font-size: 1.5rem;
            color: #065f46;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }

        input,
        select,
        textarea {
            padding: 12px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 1rem;
            width: 100%;
        }

        .btn {
            background: #10b981;
            color: white;
            padding: 10px 18px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.95rem;
        }

        .btn:hover {
            background: #059669;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1.5rem;
            border-radius: 12px;
            overflow: hidden;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
        }

        th {
            background: #d1fae5;
            color: #065f46;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f3f4f6;
        }

        tr:hover {
            background-color: #a7f3d0;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        @media (max-width: 768px) {
            form {
                grid-template-columns: 1fr;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        .app-layout {
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: white;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.06);
            z-index: 10;
            position: sticky;
            top: 0;
            left: 0;
            height: 100vh;
            min-height: 100vh;
            overflow-y: auto;
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            height: 100vh;
            background: var(--color-bg);
        }

        header {
            position: sticky;
            top: 0;
            z-index: 20;
        }

        @media (max-width: 900px) {
            .sidebar {
                width: 70px;
                min-width: 70px;
            }
        }
        
        /* Modal styles */
        .modal-backdrop {
            z-index: 1040;
        }
        
        .modal {
            z-index: 1050;
        }
        
        .modal-dialog {
            margin: 1.75rem auto;
        }
    </style>
</head>

<body>
    <div class="app-layout">
        <aside class="sidebar" th:replace="~{NhanVien/sidebar :: sidebar}"></aside>
        <main class="main-content">
            <!-- Tạo giao dịch thanh toán -->
            <div class="section">
                <h2><span class="material-icons">payment</span> Tạo thanh toán</h2>
                <form id="paymentForm" action="/nhanvien/thanhtoan/create" method="post">
                    <div><label>Mã booking</label><select id="bookingId" name="bookingId" required>
                            <option disabled selected>Chọn booking...</option>
                            <option th:each="bk : ${bookings}" th:value="${bk.id}" th:text="${bk.id + ' - ' + (bk.khachHang != null ? (bk.khachHang.ho + ' ' + bk.khachHang.ten) : 'Không rõ') + ' (' + bk.tongThanhToan + ' VND)'}"></option>
                        </select></div>
                    <div><label>Số tiền</label><input id="soTien" type="number" name="soTien" placeholder="VND" min="1000" step="1000" required /></div>
                    <div><label>Phương thức</label><select id="phuongThuc" name="phuongThuc" required>
                            <option value="" disabled selected>Chọn phương thức...</option>
                            <option th:each="pt : ${phuongThucList}" th:value="${pt}" th:text="${pt == 'CASH' ? 'Tiền mặt' : (pt == 'CHUYEN_KHOAN' ? 'Chuyển khoản' : pt)}"></option>
                        </select></div>
                    <div><label>Nội dung</label><input id="noiDung" type="text" name="noiDung" placeholder="Nhập nội dung thanh toán" /></div>
                    <div><label>Mã giao dịch (nếu có)</label><input id="maGiaoDich" type="text" name="maGiaoDich" placeholder="Mã giao dịch từ ngân hàng" /></div>
                    <div style="align-self:end">
                        <button type="submit" class="btn"><span class="material-icons">add</span>Tạo</button>
                    </div>
                </form>
            </div>

            <!-- Danh sách thanh toán -->
            <div class="section">
                <h2><span class="material-icons">receipt</span> Lịch sử thanh toán</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Mã thanh toán</th>
                            <th>Booking</th>
                            <th>Phương thức</th>
                            <th>Số tiền</th>
                            <th>Trạng thái</th>
                            <th>Ngày thanh toán</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="payment : ${payments}">
                            <td th:text="${payment.id}"></td>
                            <td th:text="${payment.booking?.id ?: 'N/A'}"></td>
                            <td th:text="${payment.phuongThuc == 'CASH' ? 'Tiền mặt' : (payment.phuongThuc == 'CHUYEN_KHOAN' ? 'Chuyển khoản' : payment.phuongThuc)}"></td>
                            <td th:text="${#numbers.formatDecimal(payment.soTien, 0, 'COMMA', 0, 'POINT')} + ' VND'"></td>
                            <td>
                                <span th:class="'status ' + ${payment.trangThai?.name() == 'THANH_CONG' ? 'completed' : (payment.trangThai?.name() == 'DANG_XU_LY' ? 'pending' : 'failed')}"
                                      th:text="${payment.trangThai?.name() == 'THANH_CONG' ? 'Hoàn thành' : (payment.trangThai?.name() == 'DANG_XU_LY' ? 'Đang xử lý' : (payment.trangThai?.value ?: 'N/A'))}"></span>
                            </td>
                            <td th:text="${#temporals.format(payment.ngayThanhToan, 'dd/MM/yyyy HH:mm')}"></td>
                            <td>
                                <div class="actions">
                                    <button class="btn btn-view-detail" th:data-payment-id="${payment.id}" title="Xem chi tiết">
                                        <span class="material-icons">visibility</span>Chi tiết
                                    </button>
                                    <button class="btn btn-print-invoice" th:data-payment-id="${payment.id}" title="In hóa đơn">
                                        <span class="material-icons">print</span>In hóa đơn
                                    </button>
                                    <button th:if="${payment.trangThai?.name() == 'DANG_XU_LY'}" class="btn btn-confirm-payment" th:data-payment-id="${payment.id}" title="Xác nhận thanh toán">
                                        <span class="material-icons">check</span>Xác nhận
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(payments)}">
                            <td colspan="7" style="text-align: center; color: #6b7280; padding: 2rem;">
                                <span class="material-icons" style="font-size: 2rem; display: block; margin-bottom: 0.5rem;">inbox</span>
                                Chưa có giao dịch nào
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    
    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    <script th:src="@{/js/nhanvien/thanhtoan.js}"></script>
</body>

</html>
