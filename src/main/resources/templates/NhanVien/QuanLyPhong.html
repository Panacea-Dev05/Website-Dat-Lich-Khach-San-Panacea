<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quản Lý Phòng - Panacea Hotel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/NhanVien/quanlyphong.css}">
</head>

<body>

    <div class="app" id="app">
        <header>
            <div class="logo" aria-label="Biểu tượng khách sạn Panacea">
                <span class="material-icons" aria-hidden="true">hotel</span>
                <div class="hotel-name" aria-live="polite">Panacea Hotel Central</div>
            </div>
            <button class="mobile-toggle" aria-label="Chuyển đổi thanh bên" id="mobileToggle">
                <span class="material-icons">menu</span>
            </button>

        </header>

        <div th:replace="~{NhanVien/sidebar :: sidebar}"></div>

        <main role="main" tabindex="0">
            <h1>Quản lý phòng</h1>
            <section class="content-section" id="contentSection">
                <table aria-label="Danh sách phòng khách sạn" id="roomTable">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Số phòng</th>
                            <th>Hạng phòng</th>
                            <th>Tầng</th>
                            <th>View</th>
                            <th style="display: none;">Giá cơ bản</th>
                            <th>Trạng thái</th>
                            <th>Thao tác</th>
                        </tr>
                    </thead>
                    <tbody id="roomTableBody">
                        <!-- Dữ liệu phòng từ controller -->
                        <tr th:each="room, stat : ${rooms}">
                            <td th:text="${stat.count}">1</td>
                            <td th:text="${room.soPhong}">101</td>
                            <td th:text="${room.roomType != null ? room.roomType.tenLoaiPhong : 'N/A'}">Standard</td>
                            <td th:text="${room.tang}">1</td>
                            <td th:text="${room.viewPhong}">City</td>
                            <td th:text="${#numbers.formatDecimal(room.giaCoBan, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'"
                                style="display: none;">
                                1,200,000 VNĐ</td>
                            <td>
                                <span
                                    th:class="${room.trangThai.name() == 'SAN_SANG' ? 'status-available' :
                                                  room.trangThai.name() == 'DA_DAT' ? 'status-booked' :
                                                  room.trangThai.name() == 'DANG_SU_DUNG' ? 'status-occupied' :
                                                  room.trangThai.name() == 'BAO_TRI' ? 'status-maintenance' : 'status-cleaning'}"
                                    th:text="${room.trangThai.name() == 'SAN_SANG' ? 'Sẵn sàng' :
                                                room.trangThai.name() == 'DA_DAT' ? 'Đã đặt' :
                                                room.trangThai.name() == 'DANG_SU_DUNG' ? 'Đang sử dụng' :
                                                room.trangThai.name() == 'BAO_TRI' ? 'Bảo trì' : 'Dọn dẹp'}">

                                </span>
                            </td>
                            <td>
                                <button class="btn-status-change" th:data-room-id="${room.id}"
                                    th:data-current-status="${room.trangThai}" th:data-room-number="${room.soPhong}"
                                    title="Thay đổi trạng thái phòng">
                                    <span class="material-icons">swap_horiz</span>
                                </button>
                                <!-- Hiển thị thông tin booking nếu có -->
                                <div th:if="${room.bookingInfo != null}"
                                    style="font-size: 0.7rem; color: #666; margin-top: 2px;">
                                    <span th:text="'Booking: ' + ${room.bookingInfo}"></span>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>

        <!-- Modal thay đổi trạng thái phòng -->
        <div id="statusChangeModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Thay đổi trạng thái phòng</h3>
                    <span class="close" id="closeModal">&times;</span>
                </div>
                <div class="modal-body">
                    <form id="statusChangeForm">
                        <input type="hidden" id="roomId" name="roomId">
                        <div class="form-group">
                            <label for="roomNumber">Số phòng:</label>
                            <input type="text" id="roomNumber" name="roomNumber" readonly>
                        </div>
                        <div class="form-group">
                            <label for="currentStatus">Trạng thái hiện tại:</label>
                            <input type="text" id="currentStatus" name="currentStatus" readonly>
                        </div>
                        <div class="form-group">
                            <label for="newStatus">Trạng thái mới:</label>
                            <select id="newStatus" name="newStatus" required>
                                <option value="">Chọn trạng thái mới...</option>
                                <option value="SAN_SANG">Sẵn sàng</option>
                                <option value="DANG_SU_DUNG">Đang sử dụng</option>
                                <option value="BAO_TRI">Bảo trì</option>
                                <option value="DON_DEP">Dọn dẹp</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="statusNote">Ghi chú (tùy chọn):</label>
                            <textarea id="statusNote" name="statusNote" rows="3"
                                placeholder="Nhập ghi chú về việc thay đổi trạng thái..."></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-cancel" id="cancelStatusChange">Hủy</button>
                    <button type="button" class="btn-confirm" id="confirmStatusChange">Xác nhận</button>
                </div>
            </div>
        </div>

        <footer>
            &copy; 2024 Panacea Hotel Booking System - All rights reserved.
        </footer>
    </div>

    <script th:src="@{/js/NhanVien/room-status.js}"></script>
</body>

</html>
