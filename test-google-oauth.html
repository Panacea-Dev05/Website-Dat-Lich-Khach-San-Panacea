<!DOCTYPE html>
<html>
<head>
    <title>Test Google OAuth Customer Creation</title>
    <meta charset="UTF-8">
</head>
<body>
    <h1>Test Google OAuth Customer Creation</h1>
    
    <div id="result"></div>
    
    <script>
        // Simulate creating a new Google OAuth customer
        async function testCreateGoogleCustomer() {
            const testData = {
                email: "newuser@gmail.com",
                name: "Test User",
                given_name: "Test",
                family_name: "User",
                picture: "https://example.com/picture.jpg"
            };
            
            try {
                const response = await fetch('/test/api/test-google-oauth', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(testData)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const result = await response.text();
                document.getElementById('result').innerHTML = `
                    <h2>Success!</h2>
                    <p>${result}</p>
                `;
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('result').innerHTML = `
                    <h2>Error!</h2>
                    <p style="color: red;">${error.message}</p>
                `;
            }
        }
        
        // Auto run test when page loads
        window.onload = function() {
            testCreateGoogleCustomer();
        };
    </script>
</body>
</html>
